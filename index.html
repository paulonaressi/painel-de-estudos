<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco de Questões — ENEM e Vunesp 2ª fase</title>
  <script>
    // Aplica o tema antes da primeira pintura para não piscar.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('bq:tema'); } catch (e) {}
      if (tema !== 'light' && tema !== 'dark') {
        tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css?v=8">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="Abrir menu de campos" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Q</span>
      <div class="brand-text">
        <strong>Banco de Questões</strong>
        <span>ENEM · Vunesp 2ª fase</span>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="resumo" id="resumo" aria-live="polite"></div>
    <button class="conta-btn" id="btn-conta" type="button" aria-haspopup="dialog"></button>
    <button class="theme-toggle" id="btn-tema" type="button" role="switch" aria-checked="false" aria-label="Tema escuro">
      <svg class="ico-sol" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ico-lua" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
      <span class="theme-thumb" aria-hidden="true"></span>
    </button>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Campos"></aside>
    <main class="pane enunciado" id="enunciado" tabindex="-1"></main>
    <section class="pane resposta" id="resposta" aria-label="Resposta e resolução"></section>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <dialog class="conta-dialogo" id="dlg-conta" aria-labelledby="dlg-conta-titulo"></dialog>

  <script src="data/vunesp-catalogo.js?v=8"></script>
  <script src="js/util.js?v=8"></script>
  <script src="js/sync.js?v=8"></script>
  <script src="js/enem.js?v=8"></script>
  <script src="js/classificador.js?v=8"></script>
  <script src="js/recortes.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
